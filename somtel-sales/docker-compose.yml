# Run with: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: somtel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: somtel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U somtel -d somtel"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: somtel-sales:latest
    pull_policy: build
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://somtel:${POSTGRES_PASSWORD}@db:5432/somtel?schema=public
      UPLOAD_DIR: /data/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  worker:
    # Uses the image built by the "app" service. Never pulled from the internet.
    image: somtel-sales:latest
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://somtel:${POSTGRES_PASSWORD}@db:5432/somtel?schema=public
      UPLOAD_DIR: /data/uploads
    command: ["npx", "tsx", "scripts/worker.ts"]
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  pgdata:
  uploads:
